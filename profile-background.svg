<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="366" viewBox="0 0 1100 366" role="img" aria-labelledby="title desc">
<title id="title">Un parcours en relation client, achats et coordination d’équipes</title>
<desc id="desc">Avant le développement, j’ai travaillé en relation client, dans les achats et la coordination d’équipes. Cette expérience m’aide à écouter, clarifier les besoins, tenir compte des contraintes et faire avancer le travail ensemble.</desc>
<rect x=".5" y=".5" width="1099" height="365" rx="18" fill="#111113" stroke="#343437"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="46" fill="#d9cda4" font-size="14" font-weight="400" letter-spacing="1.7">03 / PARCOURS</text><text x="1058" y="46" fill="#d9cda4" font-size="17" font-weight="400" text-anchor="end">Mon parcours ↗</text><text x="40" y="110" fill="#f4f3ef" font-size="43" font-weight="600" letter-spacing="-1.3">Comprendre les gens et leurs contraintes.</text><text x="43" y="151" fill="#c7c7c8" font-size="21" font-weight="400" >Avant le développement, j’ai travaillé en relation client, dans les achats</text><text x="43" y="181" fill="#c7c7c8" font-size="21" font-weight="400" >et la coordination d’équipes. J’en garde des réflexes utiles à chaque projet.</text><path d="M43 214h1014" stroke="#363638"/><path d="M373 244v83m346-83v83" stroke="#363638"/><text x="43" y="263" fill="#f4f3ef" font-size="23" font-weight="600" >Relation client</text><text x="43" y="298" fill="#c7c7c8" font-size="21" font-weight="400" >Écouter et clarifier</text><text x="43" y="327" fill="#c7c7c8" font-size="21" font-weight="400" >la demande.</text><text x="400" y="263" fill="#f4f3ef" font-size="23" font-weight="600" >Achats</text><text x="400" y="298" fill="#c7c7c8" font-size="21" font-weight="400" >Faire des choix en tenant</text><text x="400" y="327" fill="#c7c7c8" font-size="21" font-weight="400" >compte des contraintes.</text><text x="747" y="263" fill="#f4f3ef" font-size="23" font-weight="600" >Coordination d’équipes</text><text x="747" y="298" fill="#c7c7c8" font-size="21" font-weight="400" >Partager l’information</text><text x="747" y="327" fill="#c7c7c8" font-size="21" font-weight="400" >et avancer ensemble.</text></g>
</svg>
