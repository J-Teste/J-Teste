<svg xmlns="http://www.w3.org/2000/svg" width="600" height="754" viewBox="0 0 600 754" role="img" aria-labelledby="title desc">
<title id="title">Un parcours en relation client, achats et coordination d’équipes</title>
<desc id="desc">Avant le développement, j’ai travaillé en relation client, dans les achats et la coordination d’équipes. Cette expérience m’aide à écouter, clarifier les besoins, tenir compte des contraintes et faire avancer le travail ensemble.</desc>
<rect x=".5" y=".5" width="599" height="753" rx="18" fill="#111113" stroke="#343437"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" fill="#d9cda4" font-size="20" font-weight="400" letter-spacing="1.3">03 / PARCOURS</text><text x="30" y="112" fill="#f4f3ef" font-size="42" font-weight="600" letter-spacing="-1">Comprendre les gens</text><text x="30" y="162" fill="#f4f3ef" font-size="42" font-weight="600" letter-spacing="-1">et leurs contraintes.</text><text x="33" y="210" fill="#c7c7c8" font-size="26" font-weight="400" >Avant le développement, j’ai travaillé</text><text x="33" y="243" fill="#c7c7c8" font-size="26" font-weight="400" >en relation client, dans les achats</text><text x="33" y="276" fill="#c7c7c8" font-size="26" font-weight="400" >et la coordination d’équipes.</text><path d="M33 300h534" stroke="#363638"/><text x="33" y="335" fill="#f4f3ef" font-size="28" font-weight="600" >Relation client</text><text x="33" y="373" fill="#c7c7c8" font-size="26" font-weight="400" >Écouter et clarifier la demande.</text><path d="M33 409h534" stroke="#363638"/><text x="33" y="444" fill="#f4f3ef" font-size="28" font-weight="600" >Achats</text><text x="33" y="482" fill="#c7c7c8" font-size="26" font-weight="400" >Faire des choix en tenant compte</text><text x="33" y="515" fill="#c7c7c8" font-size="26" font-weight="400" >des contraintes.</text><path d="M33 551h534" stroke="#363638"/><text x="33" y="586" fill="#f4f3ef" font-size="28" font-weight="600" >Coordination d’équipes</text><text x="33" y="624" fill="#c7c7c8" font-size="26" font-weight="400" >Partager l’information</text><text x="33" y="657" fill="#c7c7c8" font-size="26" font-weight="400" >et avancer ensemble.</text><text x="33" y="718" fill="#d9cda4" font-size="24" font-weight="400" >Mon parcours ↗</text></g>
</svg>
