name: Refresh profile activity

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/update_activity.py
      - .github/workflows/update-activity.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render activity cards
        run: python3 .github/scripts/update_activity.py
      - name: Commit updated cards
        run: |
          if git diff --quiet -- profile-metrics.svg profile-metrics-mobile.svg README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-metrics.svg profile-metrics-mobile.svg README.md
          git commit -m "Refresh profile activity cards"
          git push
